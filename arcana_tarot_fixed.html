<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>ARCANA · 私人塔罗</title>
<style>
:root{--bg:#f5f5f2;--panel:#fff;--ink:#111;--muted:#777;--line:#ddd;--shadow:0 18px 50px rgba(0,0,0,.08)}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}.wrap{max-width:1050px;margin:auto;padding:28px 18px 80px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:34px}.brand{font-size:20px;font-weight:700;letter-spacing:.18em}.sub{color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:var(--shadow);margin:16px 0}
h1{font-size:clamp(34px,7vw,70px);line-height:.95;letter-spacing:-.055em;margin:16px 0}h2{font-size:22px;margin:0 0 18px}p{line-height:1.7}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:16px;padding:15px;background:#fafafa;outline:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.choice{border:1px solid var(--line);background:#fafafa;border-radius:16px;padding:14px;text-align:left;cursor:pointer;transition:.2s}.choice:hover,.choice.on{background:#111;color:#fff;border-color:#111}
.primary,.ghost{border:0;border-radius:999px;padding:13px 18px;cursor:pointer}.primary{background:#111;color:#fff}.ghost{background:#e9e9e6;color:#111}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.deck{height:310px;position:relative;overflow:hidden;margin-top:10px}.tcard{position:absolute;width:126px;height:220px;left:50%;top:55px;margin-left:-63px;border-radius:14px;border:1px solid #222;background:#111;color:white;box-shadow:0 8px 20px rgba(0,0,0,.2);transform-origin:50% 420px;transition:transform .7s cubic-bezier(.2,.8,.2,1),top .4s;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none}.tcard:before{content:"✦";font-size:36px;border:1px solid #777;border-radius:50%;width:72px;height:72px;display:grid;place-items:center}.tcard:hover{top:40px}
.results{display:flex;gap:16px;flex-wrap:wrap}.face{width:150px;min-height:245px;border:1px solid #222;border-radius:16px;background:#fff;padding:14px;display:flex;flex-direction:column;justify-content:space-between}.face.rev{transform:rotate(180deg)}.roman{font-size:11px;color:#777}.symbol{font-size:48px;text-align:center}.name{text-align:center;font-weight:650}.position{font-size:12px;color:#777;margin-top:8px;text-align:center}
.reading{white-space:pre-wrap;line-height:1.8;background:#fafafa;border-radius:18px;padding:18px;border:1px solid var(--line)}
.historyItem{padding:14px 0;border-top:1px solid var(--line);cursor:pointer}.historyItem:first-child{border-top:0}.tiny{font-size:12px;color:var(--muted)}
.hidden{display:none!important}@media(max-width:600px){.card{padding:18px;border-radius:20px}.deck{height:275px}.tcard{width:105px;height:190px;margin-left:-52px;transform-origin:50% 390px}.results{justify-content:center}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand">ARCANA</div><div class="sub">PRIVATE TAROT · 78</div></header>
<section>
<div class="tiny">私人塔罗实验室</div>
<h1>把问题放下。<br>然后抽牌。</h1>
<p style="max-width:620px;color:#666">完整 78 张 Rider–Waite 体系，包含正逆位、常用牌阵、本地历史记录。把它当成一面整理思路的镜子，而不是宇宙客服热线。</p>
</section>

<div class="card">
<h2>1 · 你的问题</h2>
<textarea id="question" placeholder="例如：未来三个月，我和这段关系的发展趋势是什么？"></textarea>
</div>

<div class="card">
<h2>2 · 选择牌阵</h2>
<div class="grid" id="spreads"><span class="tiny" id="spreadLoading">正在载入牌阵…</span></div>
</div>

<div class="card">
<h2>3 · 洗牌与选牌</h2>
<p class="tiny" id="hint">先选一个牌阵。洗牌后，牌会展开成扇形。</p>
<div class="actions"><button class="primary" id="shuffle">洗牌</button><button class="ghost" id="reset">重来</button></div>
<div class="deck hidden" id="deck"></div>
</div>

<div class="card hidden" id="resultCard">
<h2>4 · 你的牌</h2>
<div class="results" id="results"></div>
<div class="actions"><button class="primary" id="interpret">生成解读</button></div>
<div id="reading" class="reading hidden"></div>
</div>

<div class="card">
<h2>历史占卜</h2>
<div id="history"><span class="tiny">还没有记录。</span></div>
</div>
</div>

<script>
const majors=["愚人","魔术师","女祭司","皇后","皇帝","教皇","恋人","战车","力量","隐者","命运之轮","正义","倒吊人","死神","节制","恶魔","高塔","星星","月亮","太阳","审判","世界"];
const suits=[["权杖","🔥"],["圣杯","◯"],["宝剑","◇"],["星币","✦"]];
const ranks=["Ace","二","三","四","五","六","七","八","九","十","侍从","骑士","王后","国王"];
let cards=majors.map((n,i)=>({name:n,symbol:["○","∞","☾","♀","♜","✚","♡","♞","♌","⌁","⊙","⚖","▽","☠","△","♑","⚡","☆","☾","☀","♩","◎"][i],arc:"大阿卡纳"}));
suits.forEach(([s,sy])=>ranks.forEach(r=>cards.push({name:s+r,symbol:sy,arc:s})));

const meanings={
"愚人":["开始、自由、尝试","莽撞、逃避、准备不足"],"魔术师":["行动、资源、创造","分散、操控、能力未发挥"],"女祭司":["直觉、观察、隐而未显","忽略直觉、信息混乱"],"皇后":["滋养、丰盛、关系生长","过度付出、停滞、自我忽略"],"皇帝":["结构、边界、掌控","僵硬、控制、秩序失衡"],"教皇":["规则、传统、学习","挑战规则、价值冲突"],"恋人":["选择、联结、价值一致","分歧、摇摆、关系失衡"],"战车":["推进、意志、胜利","失控、方向冲突、急躁"],"力量":["韧性、温柔的控制、自信","自我怀疑、消耗、压抑"],"隐者":["独处、内省、寻找答案","封闭、过度分析、孤立"],"命运之轮":["变化、周期、转折","阻滞、重复模式、抗拒变化"],"正义":["事实、平衡、责任","偏差、逃避责任、不公平"],"倒吊人":["暂停、换视角、舍弃","拖延、徒劳牺牲、卡住"],"死神":["结束、转化、清场","抗拒结束、旧模式滞留"],"节制":["协调、耐心、整合","失衡、过量、节奏混乱"],"恶魔":["欲望、束缚、执念","松绑、看清依赖、夺回选择"],"高塔":["突变、真相暴露、结构重组","害怕变化、危机延迟"],"星星":["希望、修复、方向感","失望、信心不足、理想脱离现实"],"月亮":["不确定、潜意识、迷雾","迷雾渐散、恐惧被看见"],"太阳":["清晰、活力、成功","短暂阴影、延迟的喜悦"],"审判":["觉醒、复盘、召唤","自我否定、迟疑、拒绝总结"],"世界":["完成、整合、阶段成果","未完成、收尾不足、差最后一步"]
};
function minorMeaning(c,rev){
 const suit=c.arc, n=c.name.replace(suit,"");
 const base={权杖:"行动、动力、事业推进",圣杯:"情感、关系、感受",宝剑:"思考、沟通、冲突",星币:"现实、金钱、身体与长期积累"}[suit];
 const rank={Ace:"新机会",二:"权衡与选择",三:"发展与协作",四:"稳定与停顿",五:"摩擦与挑战",六:"过渡与进展",七:"评估与坚持",八:"加速或限制",九:"接近结果与压力",十:"完成与负担",侍从:"消息与学习",骑士:"推进与追求",王后:"成熟的内在掌控",国王:"成熟的外在掌控"}[n];
 return rev?`${base}出现阻滞；${rank}的能量可能过度、延迟或失衡`:`${base}成为主题；${rank}正在显现`;
}
const spreadData=[
["单张指引",["核心信息"]],
["过去 · 现在 · 未来",["过去","现在","未来"]],
["现状 · 阻碍 · 建议",["现状","阻碍","建议"]],
["关系牌阵",["你的状态","对方/另一方状态","关系核心","隐藏因素","发展建议"]],
["二择一",["现状","选择A的发展","选择A的代价","选择B的发展","选择B的代价"]],
["五张深度",["核心","成因","阻碍","资源","建议"]],
["凯尔特十字",["现状","交叉影响","潜意识根源","过去","显意识目标","近期未来","你的姿态","外部环境","希望与恐惧","可能结果"]]
];
let spread=spreadData[2], picked=[];
const spreads=document.getElementById("spreads"); spreads.innerHTML="";
spreadData.forEach((s,i)=>{let b=document.createElement("button");b.className="choice"+(i===2?" on":"");b.innerHTML=`<b>${s[0]}</b><br><span class=tiny>${s[1].length} 张牌</span>`;b.onclick=()=>{spread=s;picked=[];document.querySelectorAll(".choice").forEach(x=>x.classList.remove("on"));b.classList.add("on");document.getElementById("hint").textContent=`需要选择 ${s[1].length} 张牌。`;hideResult()};spreads.appendChild(b)});
function hideResult(){document.getElementById("resultCard").classList.add("hidden");document.getElementById("deck").classList.add("hidden")}
document.getElementById("shuffle").onclick=()=>{
 picked=[]; document.getElementById("results").innerHTML="";document.getElementById("reading").classList.add("hidden");
 const d=document.getElementById("deck");d.innerHTML="";d.classList.remove("hidden");
 let shuffled=[...cards].sort(()=>Math.random()-.5);
 shuffled.forEach((c,i)=>{let el=document.createElement("div");el.className="tcard";let angle=-72+(144*i/(shuffled.length-1));let radius=110;el.style.transform=`rotate(${angle}deg) translateY(${Math.abs(angle)*.18}px)`;el.onclick=()=>pick(c,el);d.appendChild(el)});
 document.getElementById("hint").textContent=`凭感觉选 ${spread[1].length} 张。别研究哪张牌背长得比较有前途，它们都一样。`;
};
function pick(c,el){
 if(picked.length>=spread[1].length||el.dataset.used)return;
 el.dataset.used=1;el.style.visibility="hidden";
 picked.push({...c,rev:Math.random()<.5,pos:spread[1][picked.length]});
 if(picked.length===spread[1].length) showResult();
}
function showResult(){
 const rc=document.getElementById("resultCard"),r=document.getElementById("results");r.innerHTML="";
 picked.forEach(c=>{let f=document.createElement("div");f.innerHTML=`<div class="face ${c.rev?"rev":""}"><div class=roman>${c.arc}</div><div class=symbol>${c.symbol}</div><div class=name>${c.name}<br><span class=tiny>${c.rev?"逆位":"正位"}</span></div></div><div class=position>${c.pos}</div>`;r.appendChild(f)});
 rc.classList.remove("hidden");rc.scrollIntoView({behavior:"smooth"});
}
document.getElementById("interpret").onclick=()=>{
 const q=document.getElementById("question").value.trim()||"未填写具体问题";
 let lines=[`问题：${q}\n牌阵：${spread[0]}\n`];
 picked.forEach(c=>{
  let m=meanings[c.name]?meanings[c.name][c.rev?1:0]:minorMeaning(c,c.rev);
  lines.push(`【${c.pos}｜${c.name}${c.rev?"逆位":"正位"}】\n${m}。在这个位置上，它更像是在提醒你关注“${m.split("、")[0]}”，而不是把牌面当成一个已经写死的结论。\n`);
 });
 const all=picked.map(c=>c.arc);
 const majorCount=all.filter(x=>x==="大阿卡纳").length;
 lines.push(`【综合】\n这组牌里有 ${majorCount} 张大阿卡纳。${majorCount>=Math.ceil(picked.length/2)?"整体更偏向阶段性的结构变化、价值选择或重要转折。":"整体更偏向具体情境、行动方式与日常变量，可调整空间较大。"} 建议把最刺眼、最让你有反应的那张牌当成复盘入口：它通常比“预测结果”更有使用价值。`);
 let text=lines.join("\n");
 let box=document.getElementById("reading");box.textContent=text;box.classList.remove("hidden");
 save(q,text);
};
function save(q,text){
 let h=JSON.parse(localStorage.getItem("arcanaHistory")||"[]");
 h.unshift({time:new Date().toLocaleString("zh-CN"),q,spread:spread[0],picked,text});h=h.slice(0,30);localStorage.setItem("arcanaHistory",JSON.stringify(h));renderHistory();
}
function renderHistory(){
 let h=JSON.parse(localStorage.getItem("arcanaHistory")||"[]"),el=document.getElementById("history");
 if(!h.length){el.innerHTML="<span class=tiny>还没有记录。</span>";return}
 el.innerHTML="";h.forEach(x=>{let d=document.createElement("div");d.className="historyItem";d.innerHTML=`<b>${x.q}</b><div class="tiny">${x.time} · ${x.spread} · ${x.picked.map(p=>p.name+(p.rev?"逆":"正")).join(" / ")}</div>`;d.onclick=()=>alert(x.text);el.appendChild(d)})
}
document.getElementById("reset").onclick=()=>{picked=[];document.getElementById("question").value="";hideResult();document.getElementById("reading").classList.add("hidden")};
renderHistory();
</script>
</body></html>
